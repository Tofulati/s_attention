[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attn-enhance"
version = "0.2.0"
description = "Context-aware scGPT priors (embedding + attention) for gene-program NMF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pandas>=2.0",
  "einops>=0.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "seaborn>=0.13",
  "anndata>=0.10",
  "scanpy>=1.9",
  "h5py>=3.8",
  "numba>=0.57",
  "umap-learn>=0.5",
  "datasets>=2.20",
  "transformers>=4.30",
  "typing-extensions>=4.2",
]

dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
